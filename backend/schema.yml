        * `DISTRIBUTOR_SHEET` - DISTRIBUTOR_SHEET
        * `MFR_LIST` - MFR_LIST
        * `VENDOR_RFQ` - VENDOR_RFQ
        * `MANUAL` - MANUAL
    DocElement:
      type: object
      description: |-
        One OCR element.

        The polygon is returned as 0-1 page fractions, which map directly to CSS
        percentages. That is what lets the viewer overlay the highlight client-side
        with no server-side geometry at all (bottleneck B5).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The element_id the model cites.
        document:
          type: string
          format: uuid
          readOnly: true
        element_path:
          type: string
          readOnly: true
          description: Positional pointer, e.g. 'pages/3/words/412' or 'tables/0/cells/17'.
            NATURAL KEY. Textract mints a fresh Block.Id on every job, so positional
            paths are what make normalisation idempotent and let a re-run re-link
            deterministically instead of orphaning citations (§7.2).
        page_number:
          type: integer
          readOnly: true
          description: Document-global, after any split-part offset is applied (§4.6).
        element_type:
          allOf:
          - $ref: '#/components/schemas/ElementTypeEnum'
          readOnly: true
        text:
          type: string
          readOnly: true
        polygon:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          description: Four vertices as ``[[x, y], ...]`` in 0-1 page fractions.
          readOnly: true
        bbox_x_min:
          type: number
          format: double
          readOnly: true
          nullable: true
        bbox_y_min:
          type: number
          format: double
          readOnly: true
          nullable: true
        bbox_x_max:
          type: number
          format: double
          readOnly: true
          nullable: true
        bbox_y_max:
          type: number
          format: double
          readOnly: true
          nullable: true
        ocr_confidence:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Scaled 0-1 from Textract's 0-100. NEVER recomputed, never overwritten
            — it is one half of the composite confidence and must stay attributable.
        reading_order:
          type: integer
          readOnly: true
          nullable: true
        table_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Groups the cells of one table; scopes extraction batches.
        row_index:
          type: integer
          readOnly: true
          nullable: true
          description: 0-indexed (Textract is 1-indexed; normalised down).
        col_index:
          type: integer
          readOnly: true
          nullable: true
        column_header:
          type: boolean
          readOnly: true
          nullable: true
      required:
      - bbox_x_max
      - bbox_x_min
      - bbox_y_max
      - bbox_y_min
      - col_index
      - column_header
      - document
      - element_path
      - element_type
      - id
      - ocr_confidence
      - page_number
      - polygon
      - reading_order
      - row_index
      - table_id
      - text
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        filename:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/DocumentRoleEnum'
          readOnly: true
          description: |-
            ADDENDUM is retained but is NOT by itself an answer to FR-14 (Risk R2): CBC has not said whether an addendum is a new document, a revision, or both. No reconciliation logic keys off this field.

            * `BID_SET` - BID_SET
            * `ADDENDUM` - ADDENDUM
            * `SPEC` - SPEC
            * `RFP` - RFP
            * `OTHER` - OTHER
        status:
          allOf:
          - $ref: '#/components/schemas/DocumentStatusEnum'
          readOnly: true
          description: |-
            Transition INTO READY_FOR_PROCESSING is the Django-to-worker handoff trigger (§3.2 rule 2) — the post_save signal enqueues to SQS on that transition and no other.

            * `UPLOADED` - UPLOADED
            * `READY_FOR_PROCESSING` - READY_FOR_PROCESSING
            * `PROCESSING` - PROCESSING
            * `PROCESSED` - PROCESSED
            * `FAILED` - FAILED
            * `QUARANTINED` - QUARANTINED
        status_detail:
          type: string
          readOnly: true
          description: Why the document failed or was quarantined. Shown to the estimator.
        page_count:
          type: integer
          readOnly: true
          nullable: true
          description: From the manifest.
        manifest_complete:
          type: boolean
          readOnly: true
          description: 'Preprocessing finished before OCR was attempted. §4.1 makes
            this an invariant, not a convenience: the manifest is the audit answer
            to ''why didn''t the system read page 47?'''
        version:
          type: integer
          readOnly: true
          default: 1
        is_encrypted:
          type: boolean
          readOnly: true
        was_repaired:
          type: boolean
          readOnly: true
          description: pikepdf repaired a structurally damaged file into derived;
            source untouched (§4.2).
        split_part_count:
          type: integer
          readOnly: true
          description: Parts the document was split into for Textract's limits (§4.6).
        estimated_ocr_cost_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
          description: Logged BEFORE the spend, so MAX_OCR_COST_PER_DOCUMENT_USD can
            veto it (§10.3).
        size_bytes:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - estimated_ocr_cost_usd
      - filename
      - id
      - is_encrypted
      - manifest_complete
      - page_count
      - project
      - role
      - size_bytes
      - split_part_count
      - status
      - status_detail
      - updated_at
      - version
      - was_repaired
    DocumentManifest:
      type: object
      description: |-
        One page's preprocessing decision.

        ``skipped`` and ``skip_reason`` are surfaced explicitly because §4.3's design
        rule is *never silently skip*: a page the system decided not to read is exactly
        the omission NFR-2 forbids, and Risk R12 makes the estimator's ability to say
        "read page 47 anyway" a required feature.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document:
          type: string
          format: uuid
          readOnly: true
        page_number:
          type: integer
          readOnly: true
          description: Document-global, 1-based. Split parts are offset back before
            writing (§4.6).
        page_class:
          allOf:
          - $ref: '#/components/schemas/PageClassEnum'
          readOnly: true
        class_confidence:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
        class_method:
          readOnly: true
          nullable: true
          description: |-
            Which tier resolved this page — lets the expensive tier be measured.

            * `BOOKMARK` - BOOKMARK
            * `TITLE_BLOCK` - TITLE_BLOCK
            * `KEYWORD` - KEYWORD
            * `MODEL` - MODEL
            * `MANUAL` - MANUAL
          oneOf:
          - $ref: '#/components/schemas/ClassMethodEnum'
          - $ref: '#/components/schemas/NullEnum'
        text_layer:
          allOf:
          - $ref: '#/components/schemas/TextLayerEnum'
          readOnly: true
        native_word_count:
          type: integer
          readOnly: true
        vector_path_count:
          type: integer
          readOnly: true
        ocr_route:
          allOf:
          - $ref: '#/components/schemas/OcrRouteEnum'
          readOnly: true
        route_reason:
          type: string
          readOnly: true
          description: 'Human-readable justification, always surfaced for SKIP. Design
            rule: never silently skip (§4.3).'
        skipped:
          type: boolean
          readOnly: true
        skip_reason:
          type: string
          nullable: true
          readOnly: true
        rotation:
          type: integer
          readOnly: true
          description: Applied at raster time. A rotated sheet rendered without it
            produces polygons that overlay 90 degrees off — the single most common
            cause of 'the highlight is in the wrong place' (§4.5).
        width_pt:
          type: number
          format: double
          readOnly: true
          nullable: true
        height_pt:
          type: number
          format: double
          readOnly: true
          nullable: true
        raster_url:
          type: string
          nullable: true
          readOnly: true
        thumb_url:
          type: string
          nullable: true
          readOnly: true
        ocr_cost_estimate:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        page_hash:
          type: string
          readOnly: true
          nullable: true
          description: sha256 of the normalised page content stream; drives addendum
            diffing (§4.7).
        forced_by_user:
          type: integer
          readOnly: true
          nullable: true
          description: An estimator overrode the routing decision — 'read page 47
            anyway' (Risk R12).
      required:
      - class_confidence
      - class_method
      - document
      - forced_by_user
      - height_pt
      - id
      - native_word_count
      - ocr_cost_estimate
      - ocr_route
      - page_class
      - page_hash
      - page_number
      - raster_url
      - rotation
      - route_reason
      - skip_reason
      - skipped
      - text_layer
      - thumb_url
      - vector_path_count
      - width_pt
    DocumentRoleEnum:
      enum:
      - BID_SET
      - ADDENDUM
      - SPEC
      - RFP
      - OTHER
      type: string
      description: |-
        * `BID_SET` - BID_SET
        * `ADDENDUM` - ADDENDUM
        * `SPEC` - SPEC
        * `RFP` - RFP
        * `OTHER` - OTHER
    DocumentStatusEnum:
      enum:
      - UPLOADED
      - READY_FOR_PROCESSING
      - PROCESSING
      - PROCESSED
      - FAILED
      - QUARANTINED
      type: string
      description: |-
        * `UPLOADED` - UPLOADED
        * `READY_FOR_PROCESSING` - READY_FOR_PROCESSING
        * `PROCESSING` - PROCESSING
        * `PROCESSED` - PROCESSED
        * `FAILED` - FAILED
        * `QUARANTINED` - QUARANTINED
    DocumentUploadRequest:
      type: object
      description: Multipart upload payload for ``POST /api/projects/{id}/documents/``.
      properties:
        file:
          type: string
          format: binary
          description: The bid-set PDF. Verified by magic bytes, not extension.
        role:
          type: string
          minLength: 1
          default: BID_SET
        ready_for_processing:
          type: boolean
          default: true
          description: Set false to stage a document without starting the pipeline
            — useful when several PDFs of one bid set are uploaded in sequence.
      required:
      - file
    ElementTypeEnum:
      enum:
      - word
      - line
      - table_cell
      - selection_mark
      type: string
      description: |-
        * `word` - WORD
        * `line` - LINE
        * `table_cell` - TABLE_CELL
        * `selection_mark` - SELECTION_MARK
    EntityTypeEnum:
      enum:
      - OPENING
      - FIELD_PROVENANCE
      - QUOTE_LINE
      - MATCH
      - DOCUMENT_MANIFEST
      type: string
      description: |-
        * `OPENING` - OPENING
        * `FIELD_PROVENANCE` - FIELD_PROVENANCE
        * `QUOTE_LINE` - QUOTE_LINE
        * `MATCH` - MATCH
        * `DOCUMENT_MANIFEST` - DOCUMENT_MANIFEST
    ExtractionMetric:
