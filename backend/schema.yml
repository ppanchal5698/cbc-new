    PatchedBidAlternateRequest:
      type: object
      properties:
        project:
          type: string
          format: uuid
        designation:
          type: string
          minLength: 1
          description: '''BASE'', ''Alternate 1'', ...'
          maxLength: 100
        description:
          type: string
        source_document:
          type: string
          format: uuid
          nullable: true
        is_base_bid:
          type: boolean
    PatchedCatalogItemRequest:
      type: object
      properties:
        vendor:
          type: string
          minLength: 1
          maxLength: 255
        series:
          type: string
          nullable: true
          description: e.g. Hager 3400 vs 3500 — ANSI/BHMA Grade 1 vs Grade 2. Not
            interchangeable.
          maxLength: 255
        sku:
          type: string
          minLength: 1
          maxLength: 255
        part_number:
          type: string
          nullable: true
          description: Explicit manufacturer part.
          maxLength: 255
        description:
          type: string
          minLength: 1
        list_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Manufacturer list. Multiplied by the vendor tier to reach cost
            (§6.2 step 2).
        list_price_effective_date:
          type: string
          format: date
          nullable: true
        list_price_sheet_version:
          type: string
          maxLength: 255
        product_type_band:
          allOf:
          - $ref: '#/components/schemas/ProductTypeBandEnum'
          description: |-
            Drives the margin band.

            * `COMMODITY` - COMMODITY
            * `RESTROOM_PARTITIONS` - RESTROOM_PARTITIONS
            * `SPECIALTY` - SPECIALTY
            * `CUSTOM_FABRICATED` - CUSTOM_FABRICATED
        line_group:
          $ref: '#/components/schemas/LineGroupEnum'
        csi_division:
          type: string
          nullable: true
          description: 08 / 09 / 10. A Division 10 accessory never matches a Division
            08 opening.
          maxLength: 10
        finish_code:
          type: string
          format: uuid
          nullable: true
        fire_rating_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: 20/45/60/90; null means unrated. HARD constraint.
        handing:
          nullable: true
          description: |-
            Null means the item is not handed. HARD constraint when set.

            * `LH` - LH
            * `RH` - RH
            * `LHR` - LHR
            * `RHR` - RHR
          oneOf:
          - $ref: '#/components/schemas/HandingEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_stock:
          type: boolean
          description: 'The top-10 list, extendable to ~20 (NR-6). NR-13: automate
            stock and top-N items; beyond that a clear MANUAL cut-off. The estimator
            owns the long tail by design, not by failure.'
        is_active:
          type: boolean
        p21_item_id:
          type: string
          nullable: true
          description: 'NULLABLE ON PURPOSE (Risk R3): P21 item IDs diverge from manufacturer
            part numbers and semi-custom items will not match cleanly. The system
            never auto-accepts a cost match on part-number similarity alone.'
          maxLength: 100
    PatchedFeedbackRequest:
      type: object
      properties:
        entity_type:
          $ref: '#/components/schemas/EntityTypeEnum'
        entity_id:
          type: string
          format: uuid
        field_name:
          type: string
          minLength: 1
          maxLength: 100
        value_before:
          type: string
          nullable: true
        value_after:
          type: string
          nullable: true
        extraction_run:
          type: string
          format: uuid
          nullable: true
        field_provenance:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
        used_for_training:
          type: boolean
          description: Promoted into the golden set (§5.10).
    PatchedFinishCodeRequest:
      type: object
      properties:
        us_code:
          type: string
          minLength: 1
          description: Legacy US code, e.g. US26D.
          maxLength: 50
        bhma_code:
          type: string
          minLength: 1
          description: BHMA numeric code, e.g. 626.
          maxLength: 50
        description:
          type: string
          minLength: 1
          maxLength: 255
        base_metal:
          type: string
          nullable: true
          description: brass / stainless / steel / nickel. Same base metal scores
            higher in matching.
          maxLength: 50
    PatchedMarginBandRequest:
      type: object
      properties:
        product_type_band:
          $ref: '#/components/schemas/ProductTypeBandEnum'
        target_margin_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,4})?$
          description: Fraction, e.g. 0.2700 for 27%.
        floor_margin_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,4})?$
          nullable: true
          description: Below this, quote lines set below_floor_flag (FR-15). Build
            the FLAG; build no approval workflow — CBC deferred routing (C13/R4).
        effective_date:
          type: string
          format: date
    PatchedProjectWriteRequest:
      type: object
      description: |-
        Create/update payload.

        Kept separate from the read serializer so the nested ``documents`` list does
        not appear as a writable field — a client must go through the verified upload
        endpoint, never attach a document by POSTing a project.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        source_channel:
          allOf:
          - $ref: '#/components/schemas/SourceChannelEnum'
          description: |-
            How the bid arrived. PHONE covers the NR-5 'create new bid request' path.

            * `EMAIL` - EMAIL
            * `MANUAL` - MANUAL
            * `PHONE` - PHONE
        initiator_email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        initiator_user:
          type: integer
          nullable: true
          description: Set when the initiator is a known internal user.
        rfp_body_text:
          type: string
          description: Unstructured RFP context from the intake email.
        brand:
          type: string
          nullable: true
          maxLength: 255
        architect:
          type: string
          nullable: true
          maxLength: 255
        general_contractor:
          type: string
          nullable: true
          maxLength: 255
    PatchedQuoteLineWriteRequest:
      type: object
      description: |-
        Estimator edits (FR-9): accept, edit, delete, or add lines.

        An override must carry a reason. That is enforced by a database check
        constraint as well as here, because an unexplained margin change on a
        customer-facing document is an audit failure (§6.2 step 3).
      properties:
        quote:
          type: string
          format: uuid
        opening:
          type: string
          format: uuid
          nullable: true
        match:
          type: string
          format: uuid
          nullable: true
        catalog_item:
          type: string
          format: uuid
          nullable: true
        line_group:
          $ref: '#/components/schemas/LineGroupEnum'
        description:
          type: string
        unit:
          type: string
          minLength: 1
          maxLength: 50
        line_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        our_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          description: Human-entered or sourced through the waterfall.
        margin_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,4})?$
          description: Human-editable.
        cost_source:
          allOf:
          - $ref: '#/components/schemas/CostSourceEnum'
          description: |-
            Which waterfall path produced this cost. MANUAL is first-class (Risk R3).

            * `P21_LAST_PO` - P21_LAST_PO
            * `DISTRIBUTOR_SHEET` - DISTRIBUTOR_SHEET
            * `MFR_LIST` - MFR_LIST
            * `VENDOR_RFQ` - VENDOR_RFQ
            * `MANUAL` - MANUAL
        cost_effective_date:
          type: string
          format: date
          nullable: true
        p21_reference:
          type: string
          description: The matched P21 record, always surfaced so the estimator can
            reject it (R3).
          maxLength: 255
        list_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        multiplier:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,4})?$
          nullable: true
          description: Copied onto the line, not just referenced, so the quote reproduces
            later.
        vendor_multiplier:
          type: string
          format: uuid
          nullable: true
        multiplier_sheet_version:
          type: string
          description: NFR-3 requires the sheet version AND the tier.
          maxLength: 255
        adders:
