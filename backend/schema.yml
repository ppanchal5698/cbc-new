      - subtotal_sale
      - tax_amount
      - tax_rate_applied
      - updated_at
    QuoteApprovalRequest:
      type: object
      description: |-
        The NFR-1 gate.

        Approval is explicit and typed rather than a status PATCH, so it always carries
        the person who approved it and cannot be set as a side effect of another edit.
      properties:
        confirm:
          type: boolean
          description: Must be true. The estimator is affirming that every line has
            been reviewed.
        notes:
          type: string
          default: ''
      required:
      - confirm
