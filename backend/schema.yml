    PasswordResetConfirmRequest:
      type: object
      description: |-
        The uid and token from the emailed link, plus the new password.

        Validation of the token pair happens in the view, not here: it needs the user
        row to run the password validators against, and a serializer that resolved the
        user would tempt a caller into using it before the token was checked.
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - token
      - uid
    PasswordResetRequestRequest:
      type: object
      description: Just an email. Whether it exists is never revealed.
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedBidAlternateRequest:
      type: object
      properties:
        project:
          type: string
          format: uuid
        designation:
          type: string
          minLength: 1
          description: '''BASE'', ''Alternate 1'', ...'
          maxLength: 100
        description:
          type: string
        source_document:
          type: string
          format: uuid
          nullable: true
        is_base_bid:
          type: boolean
    PatchedCatalogItemRequest:
      type: object
      properties:
        vendor:
          type: string
          minLength: 1
          maxLength: 255
        series:
          type: string
          nullable: true
          description: e.g. Hager 3400 vs 3500 — ANSI/BHMA Grade 1 vs Grade 2. Not
            interchangeable.
          maxLength: 255
        sku:
          type: string
          minLength: 1
          maxLength: 255
        part_number:
          type: string
          nullable: true
          description: Explicit manufacturer part.
          maxLength: 255
        description:
          type: string
          minLength: 1
        list_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Manufacturer list. Multiplied by the vendor tier to reach cost
            (§6.2 step 2).
        list_price_effective_date:
          type: string
          format: date
          nullable: true
        list_price_sheet_version:
          type: string
          maxLength: 255
        product_type_band:
          allOf:
          - $ref: '#/components/schemas/ProductTypeBandEnum'
          description: |-
            Drives the margin band.

            * `COMMODITY` - COMMODITY
            * `RESTROOM_PARTITIONS` - RESTROOM_PARTITIONS
            * `SPECIALTY` - SPECIALTY
            * `CUSTOM_FABRICATED` - CUSTOM_FABRICATED
        line_group:
          $ref: '#/components/schemas/LineGroupEnum'
        csi_division:
          type: string
          nullable: true
          description: 08 / 09 / 10. A Division 10 accessory never matches a Division
            08 opening.
          maxLength: 10
        finish_code:
          type: string
          format: uuid
          nullable: true
        fire_rating_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: 20/45/60/90; null means unrated. HARD constraint.
        handing:
          nullable: true
          description: |-
            Null means the item is not handed. HARD constraint when set.

            * `LH` - LH
            * `RH` - RH
            * `LHR` - LHR
            * `RHR` - RHR
          oneOf:
          - $ref: '#/components/schemas/HandingEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_stock:
          type: boolean
          description: 'The top-10 list, extendable to ~20 (NR-6). NR-13: automate
            stock and top-N items; beyond that a clear MANUAL cut-off. The estimator
            owns the long tail by design, not by failure.'
        is_active:
          type: boolean
        p21_item_id:
          type: string
          nullable: true
          description: 'NULLABLE ON PURPOSE (Risk R3): P21 item IDs diverge from manufacturer
            part numbers and semi-custom items will not match cleanly. The system
            never auto-accepts a cost match on part-number similarity alone.'
          maxLength: 100
    PatchedFeedbackRequest:
      type: object
      properties:
        entity_type:
          $ref: '#/components/schemas/EntityTypeEnum'
        entity_id:
          type: string
          format: uuid
        field_name:
          type: string
          minLength: 1
          maxLength: 100
        value_before:
          type: string
          nullable: true
        value_after:
          type: string
          nullable: true
        extraction_run:
          type: string
          format: uuid
          nullable: true
        field_provenance:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
        used_for_training:
          type: boolean
          description: Promoted into the golden set (§5.10).
    PatchedFinishCodeRequest:
      type: object
      properties:
        us_code:
          type: string
          minLength: 1
          description: Legacy US code, e.g. US26D.
          maxLength: 50
        bhma_code:
          type: string
          minLength: 1
          description: BHMA numeric code, e.g. 626.
          maxLength: 50
        description:
          type: string
          minLength: 1
          maxLength: 255
        base_metal:
          type: string
          nullable: true
          description: brass / stainless / steel / nickel. Same base metal scores
