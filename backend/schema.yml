components:
  schemas:
    BidAlternate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
        designation:
          type: string
          description: '''BASE'', ''Alternate 1'', ...'
          maxLength: 100
        description:
          type: string
        source_document:
          type: string
          format: uuid
          nullable: true
        is_base_bid:
          type: boolean
      required:
      - designation
      - id
      - project
    BidAlternateRequest:
      type: object
      properties:
        project:
          type: string
          format: uuid
        designation:
          type: string
          minLength: 1
          description: '''BASE'', ''Alternate 1'', ...'
          maxLength: 100
        description:
          type: string
        source_document:
          type: string
          format: uuid
          nullable: true
        is_base_bid:
          type: boolean
      required:
      - designation
      - project
    BlankEnum:
      enum:
      - ''
    CatalogItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vendor:
          type: string
          maxLength: 255
        series:
          type: string
          nullable: true
          description: e.g. Hager 3400 vs 3500 — ANSI/BHMA Grade 1 vs Grade 2. Not
            interchangeable.
          maxLength: 255
        sku:
          type: string
          maxLength: 255
        part_number:
          type: string
          nullable: true
          description: Explicit manufacturer part.
          maxLength: 255
        description:
          type: string
        list_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Manufacturer list. Multiplied by the vendor tier to reach cost
            (§6.2 step 2).
        list_price_effective_date:
          type: string
          format: date
          nullable: true
        list_price_sheet_version:
          type: string
          maxLength: 255
        product_type_band:
          allOf:
          - $ref: '#/components/schemas/ProductTypeBandEnum'
          description: |-
            Drives the margin band.

            * `COMMODITY` - COMMODITY
            * `RESTROOM_PARTITIONS` - RESTROOM_PARTITIONS
            * `SPECIALTY` - SPECIALTY
            * `CUSTOM_FABRICATED` - CUSTOM_FABRICATED
        line_group:
          $ref: '#/components/schemas/LineGroupEnum'
        csi_division:
          type: string
          nullable: true
          description: 08 / 09 / 10. A Division 10 accessory never matches a Division
            08 opening.
          maxLength: 10
        finish_code:
          type: string
          format: uuid
          nullable: true
        finish_us_code:
          type: string
          readOnly: true
        finish_bhma_code:
          type: string
          readOnly: true
        fire_rating_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: 20/45/60/90; null means unrated. HARD constraint.
        handing:
          nullable: true
          description: |-
            Null means the item is not handed. HARD constraint when set.

            * `LH` - LH
            * `RH` - RH
            * `LHR` - LHR
            * `RHR` - RHR
          oneOf:
          - $ref: '#/components/schemas/HandingEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_stock:
          type: boolean
          description: 'The top-10 list, extendable to ~20 (NR-6). NR-13: automate
            stock and top-N items; beyond that a clear MANUAL cut-off. The estimator
            owns the long tail by design, not by failure.'
        is_active:
          type: boolean
        p21_item_id:
          type: string
          nullable: true
          description: 'NULLABLE ON PURPOSE (Risk R3): P21 item IDs diverge from manufacturer
            part numbers and semi-custom items will not match cleanly. The system
            never auto-accepts a cost match on part-number similarity alone.'
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - finish_bhma_code
      - finish_us_code
      - id
      - sku
      - updated_at
      - vendor
    CatalogItemRequest:
