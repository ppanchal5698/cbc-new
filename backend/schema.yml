          type: boolean
          readOnly: true
        fire_rating_source_location:
          allOf:
          - $ref: '#/components/schemas/FireRatingSourceLocationEnum'
          readOnly: true
          description: |-
            Accumulates the empirical answer to Open Item 9 — CBC has not said where ratings live on their bid sets, so the system observes it (§5.8, Risk R1).

            * `DOOR_SCHEDULE` - DOOR_SCHEDULE
            * `FRAME_SCHEDULE` - FRAME_SCHEDULE
            * `SPEC` - SPEC
            * `MARGIN_NOTE` - MARGIN_NOTE
            * `UNKNOWN` - UNKNOWN
        hardware_group:
          type: string
          readOnly: true
          nullable: true
          description: '''HW-3'', or an explicit manufacturer part/series callout
            — both are normal (§1.3).'
        alternate_designation:
          type: string
          readOnly: true
          nullable: true
          description: Free text as written.
        bid_alternate:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Flag-gated (§7.6). Populated but not reconciled until Open
            Item 11 lands.
