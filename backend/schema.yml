      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACCEPTED
          - AWAITING_RFQ
          - MANUAL
          - PROPOSED
          - REJECTED
        description: |-
          * `PROPOSED` - PROPOSED
          * `ACCEPTED` - ACCEPTED
