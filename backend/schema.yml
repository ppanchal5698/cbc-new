          $ref: '#/components/schemas/ReviewStateEnum'
        review_notes:
          type: string
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/FieldProvenanceGrid'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
