    NullEnum:
      enum:
      - null
    OcrRouteEnum:
      enum:
      - TEXTRACT_TABLES
      - TEXTRACT_TEXT
      - NATIVE_TEXT
      - SKIP
      type: string
      description: |-
        * `TEXTRACT_TABLES` - TEXTRACT_TABLES
        * `TEXTRACT_TEXT` - TEXTRACT_TEXT
        * `NATIVE_TEXT` - NATIVE_TEXT
        * `SKIP` - SKIP
    Opening:
      type: object
      description: |-
        One opening with its per-field provenance, grid-shaped.

        ``fire_rating_absent`` and ``handing_absent`` are surfaced explicitly. FR-8
        requires flagging *missing* ratings, and a null cannot distinguish "absent",
        "not yet extracted", and "extraction rejected" — three states the estimator
        must be able to tell apart.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
        extraction_run:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Null for an item an estimator typed in. Attributing a hand-written
            line to a model run would claim a provenance it does not have, which is
            the same class of untruth §5.6 rejects a fabricated citation for.
        door_number:
          type: string
          nullable: true
          description: The mark, where the item has one. Null for a grab bar or a
            mirror.
          maxLength: 100
        description:
          type: string
          description: The item as printed on the sheet. The ledger's widest column.
        csi_division:
          type: string
          description: Full CSI section, e.g. '08 11 00' or '10 28 00'. The quote
            groups by this.
          maxLength: 16
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: How many the document says. Distinct from the quote line's
            quantity, which an estimator may change without altering what was read.
        source_kind:
          allOf:
          - $ref: '#/components/schemas/SourceKindEnum'
          description: |-
            How the ledger presents this row and which quick action it offers. Distinct from review_state, which is about one field passing the gate.

            * `EXTRACTED` - EXTRACTED
            * `REVIEW` - REVIEW
            * `DUPLICATE` - DUPLICATE
            * `MANUAL` - MANUAL
        sheet_label:
          type: string
          readOnly: true
          default: ''
          description: Sheet number, e.g. 'A-601'.
        cell_label:
          type: string
          readOnly: true
          default: ''
          description: Where on the sheet, e.g. 'Row 4'.
        quote_text:
          type: string
          description: The line as it will print on the proposal, before pricing.
        duplicate_of:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: 'The other reading of the same physical item — most often a
            base schedule row and the addendum that reissued it. Both rows are kept
            until an estimator says which to price: dropping one automatically would
            decide a question the documents genuinely leave open.'
        duplicate_note:
          type: string
          readOnly: true
          description: Why these two look like the same item.
        size_raw:
          type: string
          nullable: true
          description: As written, e.g. '3070'.
          maxLength: 32
        width_inches:
          type: integer
          readOnly: true
          nullable: true
        height_inches:
          type: integer
          readOnly: true
          nullable: true
        handing:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/HandingEnum'
          - $ref: '#/components/schemas/NullEnum'
        handing_absent:
          type: boolean
          readOnly: true
          description: EXPLICIT. 'No handing found' must be distinguishable from 'not
            yet extracted' and from null — a null cannot carry three states (FR-8).
        finish_raw:
          type: string
          readOnly: true
          nullable: true
        finish_code:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: US19 and US26D must never collapse to the same row (§1.3).
        finish_us_code:
          type: string
          readOnly: true
        finish_bhma_code:
          type: string
          readOnly: true
        fire_rating_raw:
          type: string
          readOnly: true
          nullable: true
          description: 'As written: ''90 MIN'', ''1-1/2 HR'', ''B LABEL''.'
        fire_rating_minutes:
          type: integer
          readOnly: true
          nullable: true
          description: 20 / 45 / 60 / 90 only. Unrecognised flags; NEVER defaults
            to unrated.
        fire_rating_absent:
          type: boolean
          readOnly: true
        fire_rating_source_location:
          allOf:
          - $ref: '#/components/schemas/FireRatingSourceLocationEnum'
          readOnly: true
          description: |-
            Accumulates the empirical answer to Open Item 9 — CBC has not said where ratings live on their bid sets, so the system observes it (§5.8, Risk R1).

            * `DOOR_SCHEDULE` - DOOR_SCHEDULE
            * `FRAME_SCHEDULE` - FRAME_SCHEDULE
            * `SPEC` - SPEC
            * `MARGIN_NOTE` - MARGIN_NOTE
            * `UNKNOWN` - UNKNOWN
        hardware_group:
          type: string
          nullable: true
          description: '''HW-3'', or an explicit manufacturer part/series callout
            — both are normal (§1.3).'
          maxLength: 100
        alternate_designation:
          type: string
          readOnly: true
          nullable: true
          description: Free text as written.
        bid_alternate:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Flag-gated (§7.6). Populated but not reconciled until Open
            Item 11 lands.
        wall_type:
          type: string
          readOnly: true
          nullable: true
        throat_depth:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        review_state:
          $ref: '#/components/schemas/ReviewStateEnum'
        review_notes:
          type: string
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/FieldProvenanceGrid'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - alternate_designation
      - bid_alternate
      - cell_label
      - created_at
      - duplicate_note
      - duplicate_of
      - extraction_run
      - finish_bhma_code
      - finish_code
      - finish_raw
      - finish_us_code
      - fire_rating_absent
      - fire_rating_minutes
      - fire_rating_raw
      - fire_rating_source_location
      - handing
      - handing_absent
      - height_inches
      - id
      - project
      - provenance
      - sheet_label
      - throat_depth
      - updated_at
      - wall_type
      - width_inches
    OpeningRequest:
      type: object
      description: |-
        One opening with its per-field provenance, grid-shaped.

        ``fire_rating_absent`` and ``handing_absent`` are surfaced explicitly. FR-8
        requires flagging *missing* ratings, and a null cannot distinguish "absent",
        "not yet extracted", and "extraction rejected" — three states the estimator
        must be able to tell apart.
      properties:
        project:
          type: string
          format: uuid
        door_number:
          type: string
          nullable: true
          description: The mark, where the item has one. Null for a grab bar or a
            mirror.
          maxLength: 100
        description:
          type: string
          description: The item as printed on the sheet. The ledger's widest column.
        csi_division:
          type: string
          description: Full CSI section, e.g. '08 11 00' or '10 28 00'. The quote
            groups by this.
          maxLength: 16
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: How many the document says. Distinct from the quote line's
            quantity, which an estimator may change without altering what was read.
        source_kind:
          allOf:
          - $ref: '#/components/schemas/SourceKindEnum'
          description: |-
            How the ledger presents this row and which quick action it offers. Distinct from review_state, which is about one field passing the gate.

            * `EXTRACTED` - EXTRACTED
            * `REVIEW` - REVIEW
            * `DUPLICATE` - DUPLICATE
            * `MANUAL` - MANUAL
        quote_text:
          type: string
          description: The line as it will print on the proposal, before pricing.
        size_raw:
          type: string
          nullable: true
          description: As written, e.g. '3070'.
          maxLength: 32
        hardware_group:
          type: string
          nullable: true
          description: '''HW-3'', or an explicit manufacturer part/series callout
            — both are normal (§1.3).'
          maxLength: 100
        review_state:
          $ref: '#/components/schemas/ReviewStateEnum'
        review_notes:
          type: string
      required:
      - project
    OutcomeEnum:
      enum:
      - WON
      - LOST
      type: string
      description: |-
        * `WON` - WON
        * `LOST` - LOST
    PageClassEnum:
      enum:
      - DOOR_SCHEDULE
      - HARDWARE_SCHEDULE
      - FRAME_SCHEDULE
      - FINISH_SCHEDULE
      - SPEC_TEXT
      - DRAWING
      - TITLE
      - INDEX
      - UNKNOWN
      type: string
      description: |-
        * `DOOR_SCHEDULE` - DOOR_SCHEDULE
        * `HARDWARE_SCHEDULE` - HARDWARE_SCHEDULE
        * `FRAME_SCHEDULE` - FRAME_SCHEDULE
        * `FINISH_SCHEDULE` - FINISH_SCHEDULE
        * `SPEC_TEXT` - SPEC_TEXT
        * `DRAWING` - DRAWING
        * `TITLE` - TITLE
        * `INDEX` - INDEX
        * `UNKNOWN` - UNKNOWN
