        description: |-
          Transition INTO READY_FOR_PROCESSING is the Django-to-worker handoff trigger (§3.2 rule 2) — the post_save signal enqueues to SQS on that transition and no other.

          * `UPLOADED` - UPLOADED
          * `READY_FOR_PROCESSING` - READY_FOR_PROCESSING
          * `PROCESSING` - PROCESSING
          * `PROCESSED` - PROCESSED
          * `FAILED` - FAILED
          * `QUARANTINED` - QUARANTINED
      tags:
