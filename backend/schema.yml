          maxLength: 100
        description:
          type: string
          description: The item as printed on the sheet. The ledger's widest column.
        csi_division:
          type: string
          description: Full CSI section, e.g. '08 11 00' or '10 28 00'. The quote
            groups by this.
          maxLength: 16
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: How many the document says. Distinct from the quote line's
            quantity, which an estimator may change without altering what was read.
        source_kind:
          allOf:
          - $ref: '#/components/schemas/SourceKindEnum'
          description: |-
            How the ledger presents this row and which quick action it offers. Distinct from review_state, which is about one field passing the gate.

            * `EXTRACTED` - EXTRACTED
            * `REVIEW` - REVIEW
            * `DUPLICATE` - DUPLICATE
            * `MANUAL` - MANUAL
        quote_text:
          type: string
          description: The line as it will print on the proposal, before pricing.
        size_raw:
          type: string
          nullable: true
          description: As written, e.g. '3070'.
          maxLength: 32
        hardware_group:
          type: string
          nullable: true
          description: '''HW-3'', or an explicit manufacturer part/series callout
            — both are normal (§1.3).'
          maxLength: 100
        review_state:
          $ref: '#/components/schemas/ReviewStateEnum'
        review_notes:
          type: string
