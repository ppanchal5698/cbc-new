openapi: 3.0.3
info:
  title: CBC Estimating & Pricing Copilot API
  version: 3.0.0
  description: 'Internal API for the CBC estimating copilot. The estimator stays in
    control of every quote: this API drafts, sources, and calculates — it does not
    send.'
paths:
  /api/bid-alternates/:
    get:
      operationId: bid_alternates_list
      description: |-
        FR-14 data model, flag-gated (§7.6).

        The schema exists so base-bid and alternate totals can present as separate
        comparable figures. **No reconciliation logic** — CBC has not said whether an
        addendum is a new document, a revision, or both (Open Item 11, Risk R2).
      parameters:
      - in: query
        name: is_base_bid
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
          format: uuid
      tags:
      - bid-alternates
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBidAlternateList'
          description: ''
    post:
      operationId: bid_alternates_create
      description: |-
        FR-14 data model, flag-gated (§7.6).

        The schema exists so base-bid and alternate totals can present as separate
        comparable figures. **No reconciliation logic** — CBC has not said whether an
        addendum is a new document, a revision, or both (Open Item 11, Risk R2).
      tags:
      - bid-alternates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidAlternateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BidAlternateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BidAlternateRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidAlternate'
          description: ''
  /api/bid-alternates/{id}/:
    get:
      operationId: bid_alternates_retrieve
      description: |-
        FR-14 data model, flag-gated (§7.6).

        The schema exists so base-bid and alternate totals can present as separate
        comparable figures. **No reconciliation logic** — CBC has not said whether an
        addendum is a new document, a revision, or both (Open Item 11, Risk R2).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bid alternate.
        required: true
      tags:
      - bid-alternates
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidAlternate'
          description: ''
    put:
      operationId: bid_alternates_update
      description: |-
        FR-14 data model, flag-gated (§7.6).

        The schema exists so base-bid and alternate totals can present as separate
        comparable figures. **No reconciliation logic** — CBC has not said whether an
        addendum is a new document, a revision, or both (Open Item 11, Risk R2).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bid alternate.
        required: true
      tags:
      - bid-alternates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidAlternateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BidAlternateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BidAlternateRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidAlternate'
          description: ''
    patch:
      operationId: bid_alternates_partial_update
      description: |-
        FR-14 data model, flag-gated (§7.6).

        The schema exists so base-bid and alternate totals can present as separate
        comparable figures. **No reconciliation logic** — CBC has not said whether an
        addendum is a new document, a revision, or both (Open Item 11, Risk R2).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bid alternate.
        required: true
      tags:
      - bid-alternates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBidAlternateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBidAlternateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBidAlternateRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidAlternate'
          description: ''
    delete:
      operationId: bid_alternates_destroy
      description: |-
        FR-14 data model, flag-gated (§7.6).

        The schema exists so base-bid and alternate totals can present as separate
        comparable figures. **No reconciliation logic** — CBC has not said whether an
        addendum is a new document, a revision, or both (Open Item 11, Risk R2).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bid alternate.
        required: true
      tags:
      - bid-alternates
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/catalog-items/:
    get:
      operationId: catalog_items_list
      parameters:
      - in: query
        name: csi_division
        schema:
          type: string
      - in: query
        name: fire_rating_minutes
        schema:
          type: integer
      - in: query
        name: handing
        schema:
          type: string
          nullable: true
          enum:
          - LH
          - LHR
          - RH
          - RHR
        description: |-
          Null means the item is not handed. HARD constraint when set.

          * `LH` - LH
          * `RH` - RH
          * `LHR` - LHR
          * `RHR` - RHR
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_stock
        schema:
          type: boolean
      - in: query
        name: line_group
        schema:
          type: string
          enum:
          - DOOR
          - FREIGHT
          - OTHER
          - RESTROOM_ACCESSORIES
        description: |-
          * `DOOR` - DOOR
          * `RESTROOM_ACCESSORIES` - RESTROOM_ACCESSORIES
          * `FREIGHT` - FREIGHT
          * `OTHER` - OTHER
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: product_type_band
        schema:
          type: string
          enum:
          - COMMODITY
          - CUSTOM_FABRICATED
          - RESTROOM_PARTITIONS
          - SPECIALTY
        description: |-
          Drives the margin band.

          * `COMMODITY` - COMMODITY
          * `RESTROOM_PARTITIONS` - RESTROOM_PARTITIONS
          * `SPECIALTY` - SPECIALTY
          * `CUSTOM_FABRICATED` - CUSTOM_FABRICATED
      - in: query
        name: series
        schema:
          type: string
      - in: query
        name: vendor
        schema:
          type: string
      tags:
      - catalog-items
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogItemList'
          description: ''
    post:
      operationId: catalog_items_create
      tags:
      - catalog-items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CatalogItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CatalogItemRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
  /api/catalog-items/{id}/:
