      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/catalog-items/:
    get:
      operationId: catalog_items_list
      parameters:
      - in: query
        name: csi_division
        schema:
          type: string
      - in: query
        name: fire_rating_minutes
        schema:
          type: integer
      - in: query
        name: handing
        schema:
          type: string
          nullable: true
          enum:
          - LH
          - LHR
          - RH
          - RHR
        description: |-
          Null means the item is not handed. HARD constraint when set.

          * `LH` - LH
          * `RH` - RH
          * `LHR` - LHR
          * `RHR` - RHR
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_stock
        schema:
          type: boolean
      - in: query
        name: line_group
        schema:
          type: string
          enum:
          - DOOR
          - FREIGHT
          - OTHER
          - RESTROOM_ACCESSORIES
        description: |-
          * `DOOR` - DOOR
          * `RESTROOM_ACCESSORIES` - RESTROOM_ACCESSORIES
          * `FREIGHT` - FREIGHT
          * `OTHER` - OTHER
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: product_type_band
        schema:
          type: string
          enum:
          - COMMODITY
          - CUSTOM_FABRICATED
          - RESTROOM_PARTITIONS
          - SPECIALTY
        description: |-
          Drives the margin band.

          * `COMMODITY` - COMMODITY
          * `RESTROOM_PARTITIONS` - RESTROOM_PARTITIONS
          * `SPECIALTY` - SPECIALTY
          * `CUSTOM_FABRICATED` - CUSTOM_FABRICATED
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: series
        schema:
          type: string
      - in: query
        name: vendor
        schema:
          type: string
      tags:
      - catalog-items
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogItemList'
          description: ''
    post:
      operationId: catalog_items_create
      tags:
      - catalog-items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CatalogItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CatalogItemRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
  /api/catalog-items/{id}/:
    get:
      operationId: catalog_items_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this catalog item.
        required: true
