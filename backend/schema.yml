  /api/manifest/:
    get:
      operationId: manifest_list
      description: |-
        Per-page preprocessing decisions, with the force-read override.

        The override is not a convenience. Triage is the largest cost and latency win
        in the system and it introduces one new failure mode: a schedule the classifier
        did not recognise. Risk R12's mitigation is that every SKIP is visible with a
        reason and the estimator can force any page to be read.
      parameters:
      - in: query
        name: class_method
        schema:
          type: string
          nullable: true
          enum:
          - BOOKMARK
          - KEYWORD
          - MANUAL
          - MODEL
          - TITLE_BLOCK
        description: |-
          Which tier resolved this page — lets the expensive tier be measured.

          * `BOOKMARK` - BOOKMARK
          * `TITLE_BLOCK` - TITLE_BLOCK
          * `KEYWORD` - KEYWORD
          * `MODEL` - MODEL
          * `MANUAL` - MANUAL
      - in: query
        name: document
        schema:
          type: string
          format: uuid
      - in: query
        name: ocr_route
        schema:
          type: string
          enum:
          - NATIVE_TEXT
          - SKIP
          - TEXTRACT_TABLES
          - TEXTRACT_TEXT
        description: |-
          * `TEXTRACT_TABLES` - TEXTRACT_TABLES
          * `TEXTRACT_TEXT` - TEXTRACT_TEXT
          * `NATIVE_TEXT` - NATIVE_TEXT
          * `SKIP` - SKIP
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: page_class
        schema:
          type: string
          enum:
          - DOOR_SCHEDULE
          - DRAWING
          - FINISH_SCHEDULE
          - FRAME_SCHEDULE
          - HARDWARE_SCHEDULE
          - INDEX
          - SPEC_TEXT
          - TITLE
          - UNKNOWN
        description: |-
          * `DOOR_SCHEDULE` - DOOR_SCHEDULE
          * `HARDWARE_SCHEDULE` - HARDWARE_SCHEDULE
          * `FRAME_SCHEDULE` - FRAME_SCHEDULE
          * `FINISH_SCHEDULE` - FINISH_SCHEDULE
          * `SPEC_TEXT` - SPEC_TEXT
          * `DRAWING` - DRAWING
          * `TITLE` - TITLE
          * `INDEX` - INDEX
          * `UNKNOWN` - UNKNOWN
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: text_layer
        schema:
          type: string
          enum:
          - NONE
          - RICH
          - SPARSE
          - VECTOR_OUTLINED
        description: |-
          * `RICH` - RICH
          * `SPARSE` - SPARSE
          * `NONE` - NONE
          * `VECTOR_OUTLINED` - VECTOR_OUTLINED
      tags:
      - manifest
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentManifestList'
          description: ''
