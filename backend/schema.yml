    Opening:
      type: object
      description: |-
        One opening with its per-field provenance, grid-shaped.

        ``fire_rating_absent`` and ``handing_absent`` are surfaced explicitly. FR-8
        requires flagging *missing* ratings, and a null cannot distinguish "absent",
        "not yet extracted", and "extraction rejected" — three states the estimator
        must be able to tell apart.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        extraction_run:
          type: string
          format: uuid
          readOnly: true
        door_number:
          type: string
          readOnly: true
          description: The key everything hangs off.
        size_raw:
          type: string
          readOnly: true
          nullable: true
          description: As written, e.g. '3070'.
        width_inches:
          type: integer
          readOnly: true
          nullable: true
        height_inches:
          type: integer
          readOnly: true
          nullable: true
        handing:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/HandingEnum'
          - $ref: '#/components/schemas/NullEnum'
        handing_absent:
          type: boolean
          readOnly: true
          description: EXPLICIT. 'No handing found' must be distinguishable from 'not
            yet extracted' and from null — a null cannot carry three states (FR-8).
        finish_raw:
          type: string
          readOnly: true
          nullable: true
        finish_code:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: US19 and US26D must never collapse to the same row (§1.3).
        finish_us_code:
          type: string
          readOnly: true
        finish_bhma_code:
          type: string
          readOnly: true
        fire_rating_raw:
          type: string
          readOnly: true
          nullable: true
          description: 'As written: ''90 MIN'', ''1-1/2 HR'', ''B LABEL''.'
        fire_rating_minutes:
          type: integer
          readOnly: true
          nullable: true
          description: 20 / 45 / 60 / 90 only. Unrecognised flags; NEVER defaults
            to unrated.
