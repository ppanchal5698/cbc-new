    HardwareSetComponent:
      type: object
      description: |-
        One component of a resolved hardware set (§5.11).

        ``resolved=False`` rows are returned like any other. A callout the system
        could not resolve is a finding the estimator has to act on, and hiding it
        would leave the opening pointing at a set that silently produces no lines.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        extraction_run:
          type: string
          format: uuid
          readOnly: true
        hardware_group:
          type: string
          readOnly: true
          description: The callout as written, e.g. 'HW-3'.
        component_index:
          type: integer
          readOnly: true
          default: 0
          description: Order within the set, as the specification lists it.
        resolved:
          type: boolean
          readOnly: true
          description: False when the callout appears in the door schedule but its
            definition is not in this document. Never filled in from general knowledge
            (§5.11).
        explicit_part:
          type: boolean
          readOnly: true
          description: The architect named a manufacturer part or series instead of
            a set. Not a resolution failure — the normal case (§1.3).
        description:
          type: string
          readOnly: true
        manufacturer:
          type: string
          readOnly: true
          nullable: true
        part_number:
          type: string
          readOnly: true
          nullable: true
        finish_raw:
          type: string
          readOnly: true
          nullable: true
        quantity_raw:
          type: string
          readOnly: true
          nullable: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Parsed from quantity_raw. Null when the source did not state
            one.
        review_state:
          $ref: '#/components/schemas/ReviewStateEnum'
        review_notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - component_index
      - created_at
      - description
      - explicit_part
      - extraction_run
      - finish_raw
      - hardware_group
      - id
      - manufacturer
      - part_number
      - project
      - quantity
      - quantity_raw
      - resolved
      - updated_at
