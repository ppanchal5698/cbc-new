  /api/documents/{id}/manifest/:
    get:
      operationId: documents_manifest_list
      description: One row per page with its classification, the tier that resolved
        it, its OCR route, and — for every SKIP — the reason. This is the audit answer
        to 'why didn't the system read page 47?'
      summary: Preprocessing manifest for a document (§4.1)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this document.
        required: true
      - in: query
        name: manifest_complete
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
          format: uuid
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADDENDUM
          - BID_SET
          - OTHER
          - RFP
          - SPEC
        description: |-
          ADDENDUM is retained but is NOT by itself an answer to FR-14 (Risk R2): CBC has not said whether an addendum is a new document, a revision, or both. No reconciliation logic keys off this field.

          * `BID_SET` - BID_SET
          * `ADDENDUM` - ADDENDUM
          * `SPEC` - SPEC
          * `RFP` - RFP
          * `OTHER` - OTHER
      - in: query
        name: skipped_only
        schema:
          type: boolean
        description: Only pages that were not read.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - FAILED
          - PROCESSED
          - PROCESSING
          - QUARANTINED
          - READY_FOR_PROCESSING
          - UPLOADED
        description: |-
          Transition INTO READY_FOR_PROCESSING is the Django-to-worker handoff trigger (§3.2 rule 2) — the post_save signal enqueues to SQS on that transition and no other.

          * `UPLOADED` - UPLOADED
          * `READY_FOR_PROCESSING` - READY_FOR_PROCESSING
          * `PROCESSING` - PROCESSING
          * `PROCESSED` - PROCESSED
          * `FAILED` - FAILED
          * `QUARANTINED` - QUARANTINED
      tags:
      - documents
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentManifestList'
          description: ''
  /api/documents/{id}/page-diffs/:
