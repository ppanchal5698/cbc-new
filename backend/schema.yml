          type: integer
          maximum: 2147483647
          minimum: -2147483648
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        our_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          description: Human-entered or sourced through the waterfall.
        margin_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,4})?$
          description: Human-editable.
        cost_source:
          allOf:
          - $ref: '#/components/schemas/CostSourceEnum'
          description: |-
            Which waterfall path produced this cost. MANUAL is first-class (Risk R3).

            * `P21_LAST_PO` - P21_LAST_PO
            * `DISTRIBUTOR_SHEET` - DISTRIBUTOR_SHEET
            * `MFR_LIST` - MFR_LIST
            * `VENDOR_RFQ` - VENDOR_RFQ
            * `MANUAL` - MANUAL
        cost_effective_date:
          type: string
          format: date
          nullable: true
        cost_is_stale:
          type: boolean
          readOnly: true
          description: 'Computed against COST_FRESHNESS_MONTHS (configurable, not
            hardcoded). Surfaces NR-2''s ''price may be out of date - refresh'' prompt.
            There is NO automatic silent refresh: a price that changes underneath
            an estimator without their knowledge is exactly the failure NFR-10 is
            about.'
        p21_reference:
          type: string
          description: The matched P21 record, always surfaced so the estimator can
            reject it (R3).
          maxLength: 255
        list_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        multiplier:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,4})?$
          nullable: true
          description: Copied onto the line, not just referenced, so the quote reproduces
            later.
        vendor_multiplier:
          type: string
          format: uuid
          nullable: true
        multiplier_sheet_version:
          type: string
          description: NFR-3 requires the sheet version AND the tier.
          maxLength: 255
        adders:
          description: 'Manual adders outside the base price book (NR-4): electrification,
            non-removable-pin hinges, premium and lead-time finishes.'
        total_adders:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        margin_band:
          type: string
          format: uuid
          nullable: true
          description: The default this line's margin came from.
        margin_overridden:
          type: boolean
        margin_override_reason:
          type: string
          description: e.g. the confirmed sourcing-driven Wendy's case.
        below_floor_flag:
          type: boolean
          readOnly: true
          description: 'FR-15: the FLAG, not the workflow. CBC deferred approval routing
            (C13/R4).'
        sale_each:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          readOnly: true
        extended:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          description: Group subtotal snapshot at the time of pricing.
        is_direct_equal:
          type: boolean
        substitution_note:
          type: string
        needs_review:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - below_floor_flag
      - catalog_item_detail
      - cost_is_stale
      - created_at
      - extended
      - id
      - quote
      - sale_each
      - subtotal
      - updated_at
