      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBidAlternateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBidAlternateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBidAlternateRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidAlternate'
          description: ''
    delete:
      operationId: bid_alternates_destroy
      description: |-
        FR-14 data model, flag-gated (§7.6).

        The schema exists so base-bid and alternate totals can present as separate
        comparable figures. **No reconciliation logic** — CBC has not said whether an
        addendum is a new document, a revision, or both (Open Item 11, Risk R2).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
