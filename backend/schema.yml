          type: string
          format: uuid
          nullable: true
        catalog_item_detail:
          allOf:
          - $ref: '#/components/schemas/CatalogItem'
          readOnly: true
        csi_division:
          type: string
          description: |-
            The section this line prices under, for the quote's own grouping.

            Read from the catalogue item first and the extracted line second: the
            catalogue is the library's answer and the ledger row is the document's,
            and where they differ the library is the one purchasing maintains.
          readOnly: true
        hardware_component:
          type: string
          format: uuid
          nullable: true
          description: Set when this line came from resolving the opening's hardware-set
            callout (§5.11). Hardware is most of a real CBC quote, and this is the
            link that carries an HW-3 line back to the spec text that defined it.
