    Match:
      type: object
      description: |-
        One ranked candidate.

        Per-constraint verdicts are exposed individually so the UI can say *which*
        constraint failed rather than showing a low score with no explanation (§6.1).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        opening:
          type: string
          format: uuid
          readOnly: true
        hardware_component:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Null for the door itself; set for one component of the hardware
            set that opening calls for (§5.11). The opening is recorded either way,
            because the rating and handing hard constraints belong to the opening
            — the same HW-3 on a 90-minute door and on an unrated one are not the
            same match.
        catalog_item:
          type: string
          format: uuid
          readOnly: true
        catalog_vendor:
          type: string
          readOnly: true
        catalog_sku:
          type: string
          readOnly: true
        catalog_description:
          type: string
          readOnly: true
        rank:
          type: integer
          readOnly: true
          description: 1 = best.
        match_confidence:
          type: number
          format: double
          readOnly: true
        status:
          $ref: '#/components/schemas/MatchStatusEnum'
        rating_ok:
          type: boolean
          readOnly: true
          description: A rated opening never matches an unrated item, regardless of
            text similarity.
        handing_ok:
          type: boolean
          readOnly: true
          description: An LH opening never matches an RH-only SKU.
        division_ok:
          type: boolean
          readOnly: true
          description: A Division 10 accessory never matches a Division 08 opening.
        finish_ok:
          type: boolean
          readOnly: true
        finish_score:
          type: number
          format: double
          readOnly: true
        size_score:
          type: number
          format: double
          readOnly: true
        vendor_score:
          type: number
          format: double
          readOnly: true
        stock_score:
          type: number
          format: double
          readOnly: true
        is_direct_equal:
          type: boolean
          description: The system RECORDS a substitution; it never decides one. Choosing
            an equal is estimator judgment (§1.4).
        substitution_note:
          type: string
        rejection_reason:
          type: string
          readOnly: true
          description: Which constraint failed, in words the estimator can act on.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - catalog_description
      - catalog_item
      - catalog_sku
      - catalog_vendor
      - created_at
      - division_ok
      - finish_ok
      - finish_score
      - handing_ok
      - hardware_component
      - id
      - match_confidence
      - opening
      - rank
      - rating_ok
      - rejection_reason
      - size_score
      - stock_score
      - vendor_score
