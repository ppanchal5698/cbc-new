          nullable: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        exported_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        export_key:
          type: string
          readOnly: true
          nullable: true
          description: Rendered PDF in the derived bucket.
        exported_to_email:
          type: string
          format: email
          readOnly: true
          nullable: true
          description: Captured initiator, never a group inbox (FR-10).
