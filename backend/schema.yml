  /api/doc-elements/:
    get:
      operationId: doc_elements_list
      description: |-
        Normalised OCR elements.

        Read-only and always paginated: a bid set produces tens of thousands of rows
        even after triage (Risk R9), and ``ocr_confidence`` in particular must never be
        recomputed or overwritten through an API.
      parameters:
      - in: query
        name: document
        schema:
          type: string
          format: uuid
      - in: query
        name: element_type
        schema:
          type: string
          enum:
          - line
          - selection_mark
          - table_cell
          - word
        description: |-
          * `word` - WORD
          * `line` - LINE
          * `table_cell` - TABLE_CELL
          * `selection_mark` - SELECTION_MARK
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: page_number
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: table_id
        schema:
          type: string
          format: uuid
      tags:
      - doc-elements
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocElementList'
          description: ''
  /api/doc-elements/{id}/:
    get:
      operationId: doc_elements_retrieve
      description: |-
        Normalised OCR elements.

        Read-only and always paginated: a bid set produces tens of thousands of rows
        even after triage (Risk R9), and ``ocr_confidence`` in particular must never be
        recomputed or overwritten through an API.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          description: The element_id the model cites.
        required: true
      tags:
      - doc-elements
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocElement'
          description: ''
  /api/documents/:
    get:
      operationId: documents_list
      description: |-
        Documents are created only through the verified upload path.

        Read-only on purpose: a writable ``file_key`` would let a client point a
        Document row at an arbitrary S3 object and defeat the whole provenance chain.
      parameters:
      - in: query
        name: manifest_complete
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
          format: uuid
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADDENDUM
          - BID_SET
          - OTHER
          - RFP
          - SPEC
        description: |-
          ADDENDUM is retained but is NOT by itself an answer to FR-14 (Risk R2): CBC has not said whether an addendum is a new document, a revision, or both. No reconciliation logic keys off this field.

          * `BID_SET` - BID_SET
          * `ADDENDUM` - ADDENDUM
          * `SPEC` - SPEC
          * `RFP` - RFP
          * `OTHER` - OTHER
      - in: query
        name: status
        schema:
          type: string
          enum:
          - FAILED
          - PROCESSED
          - PROCESSING
          - QUARANTINED
          - READY_FOR_PROCESSING
          - UPLOADED
        description: |-
          Transition INTO READY_FOR_PROCESSING is the Django-to-worker handoff trigger (§3.2 rule 2) — the post_save signal enqueues to SQS on that transition and no other.

          * `UPLOADED` - UPLOADED
          * `READY_FOR_PROCESSING` - READY_FOR_PROCESSING
          * `PROCESSING` - PROCESSING
          * `PROCESSED` - PROCESSED
          * `FAILED` - FAILED
          * `QUARANTINED` - QUARANTINED
      tags:
      - documents
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentList'
          description: ''
