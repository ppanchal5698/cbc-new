            a proposal goes out — not merely a stale date.
        steward:
          type: string
          description: Who owns this sheet. Blank is the honest answer while NFR-10
            is open.
          maxLength: 255
        reviewed_on:
          type: string
          format: date
          nullable: true
          description: When someone last checked this against the vendor.
        note:
          type: string
          description: What an estimator should know.
        effective_date:
          type: string
          format: date
      required:
      - multiplier
      - vendor_name
    VendorRFQ:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        quote_line:
          type: string
          format: uuid
        vendor:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/VendorRFQStatusEnum'
        request_notes:
          type: string
        requested_at:
          type: string
          format: date-time
          readOnly: true
        requested_by:
          type: integer
          readOnly: true
          nullable: true
        returned_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          nullable: true
        returned_at:
          type: string
          format: date-time
          nullable: true
        price_may_be_stale:
          type: boolean
          description: Drives NR-2's 'price may be out of date - refresh' prompt.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - quote_line
      - requested_at
      - requested_by
      - updated_at
      - vendor
    VendorRFQRequest:
      type: object
      properties:
        quote_line:
          type: string
          format: uuid
        vendor:
          type: string
          minLength: 1
          maxLength: 255
        status:
          $ref: '#/components/schemas/VendorRFQStatusEnum'
        request_notes:
          type: string
        returned_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          nullable: true
        returned_at:
          type: string
          format: date-time
          nullable: true
