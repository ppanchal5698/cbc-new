            * `EMAIL` - EMAIL
            * `MANUAL` - MANUAL
            * `PHONE` - PHONE
        initiator_email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        initiator_user:
          type: integer
          nullable: true
          description: Set when the initiator is a known internal user.
        rfp_body_text:
          type: string
          description: Unstructured RFP context from the intake email.
        brand:
          type: string
          nullable: true
          maxLength: 255
        architect:
          type: string
          nullable: true
          maxLength: 255
        general_contractor:
          type: string
          nullable: true
          maxLength: 255
        due_date:
          type: string
          format: date
          nullable: true
