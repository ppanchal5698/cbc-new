openapi: 3.0.3
info:
  title: CBC Estimating & Pricing Copilot API
  version: 3.0.0
  description: 'Internal API for the CBC estimating copilot. The estimator stays in
    control of every quote: this API drafts, sources, and calculates — it does not
    send.'
paths:
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Change your own password, proving you know the current one.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Start a session. Refuses accounts an admin has not activated.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: End the session server-side, not merely on the client.
      tags:
      - auth
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Read or edit your own profile. Never anyone else's.
      tags:
      - auth
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Read or edit your own profile. Never anyone else's.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Ask for a reset link.

        Answers identically for a registered address, an unknown one, and an account
        still awaiting approval. Anything else turns this endpoint into a way to test
        whether a given person works at CBC — and it is the one endpoint an attacker
        can hit without any credential at all.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        Redeem a reset link.

        Django's ``default_token_generator`` does the work: the token is derived from
        the user's current password hash and ``last_login``, so it stops working the
        moment either changes. That makes it single-use without a table to track, and
        invalidates every outstanding link as soon as one is redeemed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/signup/:
    post:
      operationId: auth_signup_create
      description: Request an account. Creates it inactive; an admin activates it.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Issue a DRF token for scripts, CI, and the pipeline harness.

        Separate from login because the two have different lifetimes: a session ends
        when the browser closes, a token lives until it is deleted.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/bid-alternates/:
    get:
      operationId: bid_alternates_list
      description: |-
        FR-14 data model, flag-gated (§7.6).

        The schema exists so base-bid and alternate totals can present as separate
        comparable figures. **No reconciliation logic** — CBC has not said whether an
        addendum is a new document, a revision, or both (Open Item 11, Risk R2).
      parameters:
      - in: query
        name: is_base_bid
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - bid-alternates
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBidAlternateList'
          description: ''
    post:
      operationId: bid_alternates_create
      description: |-
        FR-14 data model, flag-gated (§7.6).

        The schema exists so base-bid and alternate totals can present as separate
        comparable figures. **No reconciliation logic** — CBC has not said whether an
        addendum is a new document, a revision, or both (Open Item 11, Risk R2).
      tags:
      - bid-alternates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidAlternateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BidAlternateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BidAlternateRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidAlternate'
          description: ''
  /api/bid-alternates/{id}/:
    get:
      operationId: bid_alternates_retrieve
      description: |-
        FR-14 data model, flag-gated (§7.6).

        The schema exists so base-bid and alternate totals can present as separate
        comparable figures. **No reconciliation logic** — CBC has not said whether an
        addendum is a new document, a revision, or both (Open Item 11, Risk R2).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bid alternate.
        required: true
      tags:
      - bid-alternates
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidAlternate'
          description: ''
    put:
      operationId: bid_alternates_update
      description: |-
        FR-14 data model, flag-gated (§7.6).

        The schema exists so base-bid and alternate totals can present as separate
        comparable figures. **No reconciliation logic** — CBC has not said whether an
        addendum is a new document, a revision, or both (Open Item 11, Risk R2).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bid alternate.
        required: true
      tags:
      - bid-alternates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidAlternateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BidAlternateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BidAlternateRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidAlternate'
          description: ''
    patch:
      operationId: bid_alternates_partial_update
      description: |-
        FR-14 data model, flag-gated (§7.6).

        The schema exists so base-bid and alternate totals can present as separate
        comparable figures. **No reconciliation logic** — CBC has not said whether an
        addendum is a new document, a revision, or both (Open Item 11, Risk R2).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bid alternate.
        required: true
      tags:
